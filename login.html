<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Streetly Science Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1a2a4f;
      --navy-dark: #0f1d3d;
      --red: #c8202c;
      --gold: #d4a534;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito Sans', sans-serif;
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .login-card {
      background: white;
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,0.3);
    }

    .shield {
      width: 64px; height: 72px;
      margin: 0 auto 1.25rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shield svg { width: 100%; height: 100%; }
    .shield-text {
      position: absolute;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      color: white;
      font-size: 1.1rem;
      top: 50%; left: 50%;
      transform: translate(-50%, -55%);
    }

    h1 {
      font-family: 'Nunito', sans-serif;
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 0.3rem;
    }
    .subtitle {
      color: #64748b;
      font-size: 0.875rem;
      margin-bottom: 2rem;
    }

    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      background: var(--navy);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      margin-bottom: 1rem;
    }
    .btn-google:hover {
      background: var(--navy-dark);
      transform: translateY(-1px);
    }
    .btn-google:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.25rem 0;
      color: #94a3b8;
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    .back-link {
      color: #64748b;
      font-size: 0.825rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--navy); }

    .notice {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-size: 0.78rem;
      color: #64748b;
      margin-top: 1.5rem;
      text-align: left;
      line-height: 1.5;
    }

    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 0.825rem;
      color: #dc2626;
      margin-bottom: 1rem;
      display: none;
    }

    .loading-msg {
      color: #64748b;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="shield">
      <svg viewBox="0 0 88 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M44 0 L88 14 L88 50 Q88 80 44 100 Q0 80 0 50 L0 14 Z" fill="#c8202c" stroke="#d4a534" stroke-width="2"/>
      </svg>
      <div class="shield-text">SSH</div>
    </div>

    <h1>Streetly Science Hub</h1>
    <p class="subtitle">Sign in with your school Google account to track your progress</p>

    <div class="error-msg" id="error-msg"></div>
    <div class="loading-msg" id="loading-msg">⏳ Signing you in...</div>

    <button class="btn-google" id="google-btn" onclick="handleSignIn()">
      <svg width="20" height="20" viewBox="0 0 48 48">
        <path fill="#FFF" d="M43.611 20.083H42V20H24v8h11.303C33.973 32.617 29.418 36 24 36c-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
      </svg>
      Sign in with Google
    </button>

    <div class="notice">
      🔒 Your data is stored securely and only visible to you. Sign in with your school Google account (@thestreetlyacademy.co.uk or personal Gmail).
    </div>
  </div>

  <script type="module">
    import { signInWithGoogle, onAuthChange } from './firebase.js';

    // If already signed in, redirect to index
    onAuthChange(user => {
      if (user) {
        const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
        window.location.href = redirect;
      }
    });

    window.handleSignIn = async function() {
      const btn = document.getElementById('google-btn');
      const errorMsg = document.getElementById('error-msg');
      const loadingMsg = document.getElementById('loading-msg');

      btn.disabled = true;
      errorMsg.style.display = 'none';
      loadingMsg.style.display = 'block';

      try {
        await signInWithGoogle();
        // onAuthChange will handle redirect
      } catch (err) {
        btn.disabled = false;
        loadingMsg.style.display = 'none';
        errorMsg.style.display = 'block';
        errorMsg.textContent = 'Sign in failed. Please try again. Make sure pop-ups are allowed for this site.';
      }
    };
  </script>
</body>
</html>
