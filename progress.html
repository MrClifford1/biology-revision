<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Progress — Streetly Science Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1a2a4f;
      --navy-dark: #0f1d3d;
      --red: #c8202c;
      --gold: #d4a534;
      --bg: #f5f6fa;
      --text: #1a2a4f;
      --subtext: #5a6885;
      --border: #e2e6f0;
      --card: #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    .topnav {
      background: var(--navy-dark);
      padding: 0.7rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .topnav a { color: #94a3b8; text-decoration: none; font-size: 0.875rem; font-weight: 600; transition: color 0.2s; }
    .topnav a:hover { color: white; }
    .topnav-title { color: white; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.95rem; margin-left: auto; }

    .page-header {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
      color: white;
      padding: 1.5rem 2rem;
    }
    .page-header-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .user-avatar {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      object-fit: cover;
      flex-shrink: 0;
    }
    .user-avatar-placeholder {
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--red);
      border: 2px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.3rem;
      color: white;
      flex-shrink: 0;
    }
    .user-info h1 { font-family: 'Nunito', sans-serif; font-size: 1.3rem; font-weight: 900; }
    .user-info p { color: #c5cee8; font-size: 0.85rem; margin-top: 0.1rem; }

    .btn-signout {
      margin-left: auto;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.825rem;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-signout:hover { background: rgba(255,255,255,0.2); }

    main { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem 3rem; }

    .section-title {
      font-family: 'Nunito', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 1rem;
    }

    /* SUMMARY CARDS */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem 1.25rem;
      text-align: center;
    }
    .summary-number {
      font-family: 'Nunito', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      color: var(--navy);
      line-height: 1;
    }
    .summary-label { font-size: 0.78rem; color: var(--subtext); margin-top: 0.25rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }

    /* MODULE PROGRESS */
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .module-progress-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      border-left: 4px solid #e2e8f0;
    }
    .module-progress-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.85rem;
    }
    .mod-badge {
      width: 36px; height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 0.8rem;
      color: white;
      flex-shrink: 0;
    }
    .mod-title { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.9rem; }
    .mod-sub { font-size: 0.75rem; color: var(--subtext); }

    .progress-bar-wrap {
      background: #f1f5f9;
      border-radius: 100px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.6s ease;
    }
    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--subtext);
    }

    /* RAG SUMMARY v2 */
    .rag-row {
      display: flex;
      gap: 0.35rem;
      margin-top: 0.6rem;
      flex-wrap: wrap;
    }
    .rag-chip {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.18rem 0.5rem;
      border-radius: 100px;
      font-family: 'Nunito', sans-serif;
    }
    /* tier progress bar on module cards */
    .tier-bar-wrap { background: #e2e8f0; border-radius: 100px; height: 6px; overflow: hidden; margin-top: 0.5rem; margin-bottom: 0.25rem; }
    .tier-bar-fill { height: 100%; border-radius: 100px; transition: width 0.6s ease; }
    .tier-summary { font-size: 0.72rem; color: var(--subtext); display: flex; justify-content: space-between; margin-bottom: 0.4rem; }

    /* RECENT MOCKS */
    .mocks-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .mock-row {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem 1.1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .mock-module {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.875rem;
      min-width: 120px;
    }
    .mock-score {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
    }
    .mock-pct {
      font-size: 0.78rem;
      color: var(--subtext);
    }
    .mock-date { margin-left: auto; font-size: 0.75rem; color: var(--subtext); }
    .mock-grade {
      padding: 0.2rem 0.6rem;
      border-radius: 100px;
      font-size: 0.72rem;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
    }
    .grade-excellent { background: #dcfce7; color: #16a34a; }
    .grade-good { background: #dbeafe; color: #1d4ed8; }
    .grade-developing { background: #fef3c7; color: #d97706; }
    .grade-practise { background: #fee2e2; color: #dc2626; }

    .empty-state {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2rem;
      text-align: center;
      color: var(--subtext);
      font-size: 0.9rem;
    }

    .loading-state { text-align: center; padding: 3rem; color: var(--subtext); }

    /* exam target selector */
    .target-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .target-card label { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.875rem; flex-shrink: 0; }
    .target-select {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.85rem;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.875rem;
      color: var(--text);
      background: white;
      cursor: pointer;
    }
    .target-select:focus { outline: none; border-color: var(--navy); }
    .target-save {
      background: var(--navy);
      color: white;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 0.825rem;
      padding: 0.45rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .target-save:hover { background: var(--navy-dark); }
    .target-saved { color: #16a34a; font-size: 0.8rem; font-weight: 600; display: none; }

    @media (max-width: 600px) {
      .modules-grid { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── TABS ────────────────────────────────────────────────────────────────── */
    .progress-tabs { display: flex; gap: 0.4rem; padding: 1rem 1.5rem 0; max-width: 1000px; margin: 0 auto; flex-wrap: wrap; }
    .progress-tab { border: none; background: none; padding: 0.55rem 1.1rem; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.82rem; color: var(--subtext); cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.15s; white-space: nowrap; }
    .progress-tab:hover { color: var(--navy); }
    .progress-tab.active { color: var(--navy); border-bottom-color: var(--navy); }
    .progress-panel { display: none; max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
    .progress-panel.active { display: block; }

    /* ── OVERVIEW ────────────────────────────────────────────────────────────── */
    .subject-balance { display: grid; grid-template-columns: repeat(3,1fr); gap: 0.75rem; margin-bottom: 1.5rem; }
    .balance-card { background: white; border: 1.5px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; }
    .balance-label { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.8rem; margin-bottom: 0.5rem; }
    .balance-bar-wrap { background: #f1f5f9; border-radius: 100px; height: 8px; overflow: hidden; margin-bottom: 0.3rem; }
    .balance-bar-fill { height: 100%; border-radius: 100px; }
    .balance-stat { font-size: 0.72rem; color: var(--subtext); }
    .decay-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .decay-row { background: #fff7ed; border: 1.5px solid #fed7aa; border-radius: 10px; padding: 0.6rem 0.85rem; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
    .decay-mod { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.8rem; color: var(--navy); }
    .decay-topic { font-size: 0.78rem; color: var(--subtext); flex: 1; }
    .decay-days { font-size: 0.72rem; font-weight: 700; color: #c2410c; }
    .streak-card { background: linear-gradient(135deg, #fef9c3, #fef3c7); border: 1.5px solid #fde68a; border-radius: 14px; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
    .streak-num { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 2.2rem; color: #92400e; line-height: 1; }
    .streak-text { font-size: 0.82rem; color: #78350f; }

    /* ── BY MODULE ───────────────────────────────────────────────────────────── */
    .module-expand-card { background: white; border: 1.5px solid var(--border); border-radius: 14px; margin-bottom: 0.75rem; overflow: hidden; }
    .module-expand-header { display: flex; align-items: center; gap: 0.75rem; padding: 1rem 1.1rem; cursor: pointer; user-select: none; }
    .module-expand-header:hover { background: #f8fafc; }
    .mec-badge { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 0.78rem; color: white; flex-shrink: 0; }
    .mec-title { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.88rem; flex: 1; }
    .mec-summary { font-size: 0.72rem; color: var(--subtext); }
    .mec-tier { font-size: 0.78rem; font-weight: 700; }
    .mec-chevron { font-size: 0.75rem; color: var(--subtext); transition: transform 0.2s; }
    .module-expand-card.open .mec-chevron { transform: rotate(180deg); }
    .module-expand-body { display: none; border-top: 1px solid var(--border); padding: 0.75rem 1.1rem 1rem; }
    .module-expand-card.open .module-expand-body { display: block; }
    .topic-expand-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.35rem 0; border-bottom: 1px solid #f1f5f9; }
    .topic-expand-row:last-child { border-bottom: none; }
    .topic-name { font-size: 0.8rem; font-weight: 600; flex: 1; }
    .topic-bar-wrap { width: 100px; height: 6px; background: #f1f5f9; border-radius: 100px; overflow: hidden; flex-shrink: 0; }
    .topic-bar-fill { height: 100%; border-radius: 100px; }
    .topic-tier-label { font-size: 0.68rem; font-weight: 700; color: var(--subtext); width: 75px; text-align: right; flex-shrink: 0; }
    .schedule-flag { font-size: 0.62rem; font-weight: 800; padding: 0.08rem 0.35rem; border-radius: 100px; white-space: nowrap; }
    .flag-current { background: #dcfce7; color: #14532d; }
    .flag-past    { background: #fef9c3; color: #713f12; }
    .flag-asmt    { background: #fce7f3; color: #831843; }

    /* ── INSIGHTS ────────────────────────────────────────────────────────────── */
    .insight-btn-wrap { text-align: center; margin-bottom: 1.5rem; }
    .btn-insight { background: linear-gradient(135deg, #1a2a4f, #3b82f6); color: white; border: none; border-radius: 14px; padding: 0.85rem 2rem; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; box-shadow: 0 4px 15px rgba(59,130,246,0.3); transition: all 0.2s; }
    .btn-insight:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
    .btn-insight:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; transform: none; }
    .insight-cooldown-msg { background: #f0f4ff; border: 1.5px solid #c7d2fe; border-radius: 12px; padding: 0.85rem 1.1rem; font-size: 0.85rem; color: var(--navy); margin-bottom: 1rem; }
    .insight-bullets { list-style: none; display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.25rem; }
    .insight-bullet { background: white; border: 1.5px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; display: flex; align-items: flex-start; gap: 0.75rem; }
    .insight-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 0.1rem; }
    .insight-text { font-size: 0.85rem; flex: 1; line-height: 1.5; }
    .btn-take-me { font-size: 0.75rem; font-weight: 800; font-family: 'Nunito', sans-serif; background: var(--navy); color: white; border: none; border-radius: 7px; padding: 0.25rem 0.65rem; cursor: pointer; flex-shrink: 0; text-decoration: none; display: inline-flex; align-items: center; }
    .btn-take-me:hover { background: var(--navy-dark); }
    .ai-insight-wrap { background: linear-gradient(135deg, #eff6ff, #f0fdf4); border: 1.5px solid #bfdbfe; border-radius: 14px; padding: 1.25rem 1.5rem; }
    .ai-insight-header { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 0.88rem; color: var(--navy); }
    .ai-insight-body { font-size: 0.88rem; line-height: 1.7; color: var(--text); white-space: pre-line; }
    .ai-loading { display: flex; align-items: center; gap: 0.5rem; color: var(--subtext); font-size: 0.85rem; }
    .ai-spinner { width: 18px; height: 18px; border: 2px solid #e2e6f0; border-top-color: var(--navy); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .asmt-subj-pill { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.65rem; padding: 0.15rem 0.5rem; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.05em; }
    .asmt-pill-bio { background: #dcfce7; color: #14532d; }
    .asmt-pill-chem { background: #fef9c3; color: #713f12; }
    .asmt-pill-phys { background: #dbeafe; color: #1e3a8a; }
    .asmt-countdown { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 0.82rem; padding: 0.22rem 0.65rem; border-radius: 100px; }
    .asmt-cd-soon { background: #fef2f2; color: #dc2626; border: 1.5px solid #fca5a5; }
    .asmt-cd-upcoming { background: #fef9c3; color: #713f12; border: 1.5px solid #fde68a; }
    .asmt-cd-future { background: #f1f5f9; color: #475569; border: 1.5px solid #cbd5e1; }

    /* ── HISTORY ─────────────────────────────────────────────────────────────── */
    .session-group { margin-bottom: 1.5rem; }
    .session-date-label { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 0.78rem; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem; padding-bottom: 0.3rem; border-bottom: 1px solid var(--border); }
    .history-row { background: white; border: 1.5px solid var(--border); border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; cursor: pointer; transition: border-color 0.15s; }
    .history-row:hover { border-color: var(--navy); }
    .history-type-badge { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.65rem; padding: 0.18rem 0.55rem; border-radius: 100px; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
    .htype-mock     { background: #dbeafe; color: #1e40af; }
    .htype-paper    { background: #ede9fe; color: #5b21b6; }
    .htype-words    { background: #dcfce7; color: #14532d; }
    .htype-flashcard{ background: #fef9c3; color: #713f12; }
    .history-mod { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.82rem; }
    .history-score { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1rem; }
    .history-pct { font-size: 0.72rem; color: var(--subtext); }
    .history-time { margin-left: auto; font-size: 0.72rem; color: var(--subtext); }
    .btn-load-more { display: block; width: 100%; background: white; border: 1.5px solid var(--border); border-radius: 10px; padding: 0.65rem; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.82rem; color: var(--subtext); cursor: pointer; text-align: center; margin-top: 0.5rem; }
    .btn-load-more:hover { border-color: var(--navy); color: var(--navy); }
    /* Review modal */
    .review-overlay { position: fixed; inset: 0; background: rgba(15,29,61,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 1rem; }
    .review-modal { background: white; border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 520px; max-height: 85vh; overflow-y: auto; }
    .review-modal h3 { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1rem; color: var(--navy); margin-bottom: 1rem; }
    .review-topic-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.4rem 0; border-bottom: 1px solid #f1f5f9; }
    .review-topic-row:last-child { border-bottom: none; }
    .review-topic-name { font-size: 0.82rem; flex: 1; }
    .review-marks { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.85rem; }
    .review-correct { color: #16a34a; }
    .review-wrong   { color: #dc2626; }
    .review-partial { color: #d97706; }

    /* ── ASSIGNMENTS TAB ────────────────────────────────────────────────────── */
    .assign-card { background: white; border: 1.5px solid var(--border); border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 0.75rem; display: flex; align-items: flex-start; gap: 1rem; flex-wrap: wrap; transition: border-color 0.15s; }
    .assign-card:hover { border-color: #94a3b8; }
    .assign-card.status-active { border-left: 4px solid var(--gold); }
    .assign-card.status-completed { border-left: 4px solid #22c55e; }
    .assign-card.status-expired { border-left: 4px solid #ef4444; opacity: 0.8; }
    .assign-info { flex: 1; min-width: 0; }
    .assign-label { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.2rem; }
    .assign-label.lbl-active { color: var(--gold); }
    .assign-label.lbl-completed { color: #16a34a; }
    .assign-label.lbl-expired { color: #ef4444; }
    .assign-title { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.95rem; color: var(--navy); }
    .assign-meta { font-size: 0.75rem; color: var(--subtext); margin-top: 0.25rem; display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
    .assign-type-pill { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.65rem; padding: 0.12rem 0.45rem; border-radius: 100px; background: #e0e7ff; color: #4338ca; }
    .assign-urgency { font-weight: 700; }
    .assign-urgency.urgent { color: #dc2626; }
    .assign-urgency.soon { color: #d97706; }
    .assign-urgency.fine { color: #16a34a; }
    .assign-urgency.expired { color: #ef4444; }
    .assign-score { text-align: right; flex-shrink: 0; }
    .assign-score-num { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.2rem; color: #16a34a; }
    .assign-score-sub { font-size: 0.7rem; color: var(--subtext); margin-top: 0.1rem; }
    .btn-assign-go { display: inline-flex; align-items: center; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.85rem; padding: 0.55rem 1.25rem; border-radius: 10px; text-decoration: none; border: none; cursor: pointer; transition: opacity 0.15s; white-space: nowrap; flex-shrink: 0; align-self: center; }
    .btn-assign-go:hover { opacity: 0.85; }
    .btn-go-active { background: var(--navy); color: white; }
    .btn-go-retry { background: #22c55e; color: white; }
    .btn-go-late { background: #ef4444; color: white; }
    .assign-filter-row { display: flex; gap: 0.4rem; margin-bottom: 1rem; flex-wrap: wrap; }
    .assign-filter-btn { border: 1.5px solid var(--border); background: white; border-radius: 8px; padding: 0.3rem 0.75rem; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.78rem; color: var(--subtext); cursor: pointer; transition: all 0.15s; }

    .assign-empty { background: white; border: 1.5px solid var(--border); border-radius: 14px; padding: 2.5rem 2rem; text-align: center; color: var(--subtext); font-size: 0.9rem; }

    /* ── SETTINGS DRAWER ────────────────────────────────────────────────────── */
    .settings-overlay { position:fixed;inset:0;background:rgba(15,29,61,0.5);z-index:900;backdrop-filter:blur(2px); }
    .settings-overlay.hidden { display:none; }
    .settings-drawer { position:fixed;top:0;right:0;height:100%;width:320px;max-width:90vw;background:white;z-index:1000;box-shadow:-8px 0 40px rgba(0,0,0,0.15);display:flex;flex-direction:column;transition:transform 0.25s ease; }
    .settings-drawer.hidden { transform:translateX(100%); }
    .drawer-header { background:var(--navy-dark);color:white;padding:1.25rem 1.5rem;display:flex;align-items:center;justify-content:space-between; }
    .drawer-header h2 { font-family:'Nunito',sans-serif;font-weight:900;font-size:1.05rem; }
    .drawer-close { background:none;border:none;color:#94a3b8;font-size:1.4rem;cursor:pointer;line-height:1;padding:0; }
    .drawer-close:hover { color:white; }
    .drawer-body { padding:1.5rem;flex:1;overflow-y:auto; }
    .drawer-section-title { font-family:'Nunito',sans-serif;font-weight:800;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--subtext);margin-bottom:0.75rem; }
    .current-class-badge { background:#f0f4ff;border:2px solid var(--navy);border-radius:10px;padding:0.65rem 1rem;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.1rem;color:var(--navy);text-align:center;margin-bottom:1rem; }
    .year-grid-s { display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;margin-bottom:1rem; }
    .year-btn-s { border:2px solid var(--border);background:#f8fafc;border-radius:12px;padding:0.75rem 0.5rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.95rem;color:var(--text);cursor:pointer;transition:all 0.18s;text-align:center; }
    .year-btn-s:hover { border-color:var(--navy);background:#f0f4ff; }
    .year-btn-s.selected { border-color:var(--navy);background:var(--navy);color:white; }
    .class-grid-s { display:grid;grid-template-columns:repeat(5,1fr);gap:0.4rem;margin-bottom:1rem; }
    .class-btn-s { border:2px solid var(--border);background:#f8fafc;border-radius:8px;padding:0.45rem 0.2rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.75rem;color:var(--text);cursor:pointer;transition:all 0.18s;text-align:center; }
    .class-btn-s:hover { border-color:var(--navy);background:#f0f4ff; }
    .class-btn-s.selected { border-color:var(--red);background:var(--red);color:white; }
    .btn-drawer-confirm { width:100%;background:var(--navy);color:white;border:none;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.95rem;padding:0.8rem;border-radius:12px;cursor:pointer;transition:background 0.18s;margin-top:0.5rem; }
    .btn-drawer-confirm:hover { background:var(--navy-dark); }
    .btn-drawer-confirm:disabled { background:#cbd5e1;cursor:not-allowed; }
    .drawer-divider { border:none;border-top:1px solid var(--border);margin:1.25rem 0; }
  </style>
</head>
<body>

  <span class="topnav-title">My Progress</span>
  <div id="staff-nav-links" style="display:none;gap:0.4rem;align-items:center">
    <a href="teacher.html" id="nav-teacher-link" style="display:none;background:#6366f1;color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.7rem;padding:0.2rem 0.6rem;border-radius:6px;text-decoration:none;white-space:nowrap">👨‍🏫 Teacher</a>
    <a href="admin.html" id="nav-admin-link" style="display:none;background:#e85d4a;color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.7rem;padding:0.2rem 0.6rem;border-radius:6px;text-decoration:none;white-space:nowrap">🏫 Admin</a>
    <a href="superadmin.html" id="nav-superadmin-link" style="display:none;background:#c8202c;color:white;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.7rem;padding:0.2rem 0.6rem;border-radius:6px;text-decoration:none;white-space:nowrap">🛡️ Super Admin</a>
  </div>
  <button onclick="openSettings()" title="Settings" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#94a3b8;font-size:1rem;padding:0.4rem 0.6rem;border-radius:8px;cursor:pointer;line-height:1;transition:all 0.2s;margin-left:0.5rem" onmouseover="this.style.color='white'" onmouseout="this.style.color='#94a3b8'">⚙️</button>
</nav>

<div class="page-header">

  </div>
</div>

<div id="assessment-banners"></div>

<!-- TAB NAV -->
<div style="background:white;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50">

    <button class="progress-tab active" onclick="switchTab('overview',this)">📊 Overview</button>
    <button class="progress-tab" onclick="switchTab('modules',this)">📚 By Module</button>
    <button class="progress-tab" onclick="switchTab('insights',this)">💡 Insights</button>
    <button class="progress-tab" onclick="switchTab('upcoming',this)">📅 Upcoming</button>
    <button class="progress-tab" onclick="switchTab('history',this)">🕐 History</button>

  </div>

<!-- OVERVIEW TAB -->

  <div class="loading-state" id="history-loading">Loading activity history...</div>
</div>

<script type="module">
  import {
    onAuthChange, signOutUser, getUserProfile, updateExamTarget,
    getAllProgress, saveClass, getUserRole,
    getUpcomingAssessmentsForStudent, getModuleScheduleStatus,
    saveInsightTimestamp, getInsightTimestamp, getActivityLog,
    saveLastInsight, getLastInsight,
    getActiveAssignmentsForClass, getMyAssignmentCompletion
  } from './firebase.js';

  const MODULE_META = {
    b1:{title:'Cell Biology',colour:'#0d9488',subject:'biology'}, b2:{title:'Organisation',colour:'#e85d4a',subject:'biology'}, b3:{title:'Infection & Response',colour:'#f59e0b',subject:'biology'}, b4:{title:'Bioenergetics',colour:'#22c55e',subject:'biology'}, b5:{title:'Homeostasis & Response',colour:'#8b5cf6',subject:'biology'}, b6:{title:'Inheritance & Evolution',colour:'#3b82f6',subject:'biology'}, b7:{title:'Ecology',colour:'#16a34a',subject:'biology'},
    p1:{title:'Energy',colour:'#f97316',subject:'physics'}, p2:{title:'Electricity',colour:'#eab308',subject:'physics'}, p3:{title:'Particle Model',colour:'#06b6d4',subject:'physics'}, p4:{title:'Atomic Structure',colour:'#8b5cf6',subject:'physics'}, p5:{title:'Forces',colour:'#ec4899',subject:'physics'}, p6:{title:'Waves',colour:'#14b8a6',subject:'physics'}, p7:{title:'Magnetism',colour:'#6366f1',subject:'physics'},
    c1:{title:'Atomic Structure & Periodic Table',colour:'#0ea5e9',subject:'chemistry'}, c2:{title:'Bonding & Structure',colour:'#10b981',subject:'chemistry'}, c3:{title:'Quantitative Chemistry',colour:'#f59e0b',subject:'chemistry'}, c4:{title:'Chemical Changes',colour:'#ef4444',subject:'chemistry'}, c5:{title:'Energy Changes',colour:'#8b5cf6',subject:'chemistry'}, c6:{title:'Rate & Extent of Reactions',colour:'#f97316',subject:'chemistry'}, c7:{title:'Organic Chemistry',colour:'#06b6d4',subject:'chemistry'}, c8:{title:'Chemical Analysis',colour:'#ec4899',subject:'chemistry'}, c9:{title:'Chemistry of the Atmosphere',colour:'#16a34a',subject:'chemistry'}, c10:{title:'Using Resources',colour:'#6366f1',subject:'chemistry'},
  };

  const TIER_META = {
    not_started:{label:'Not Started',emoji:'⬜',colour:'#cbd5e1'},
    beginning:  {label:'Beginning',  emoji:'🔴',colour:'#ef4444'},
    developing: {label:'Developing', emoji:'🟠',colour:'#f97316'},
    approaching:{label:'Approaching',emoji:'🟡',colour:'#eab308'},
    confident:  {label:'Confident',  emoji:'🟢',colour:'#22c55e'},
    mastered:   {label:'Mastered',   emoji:'💙',colour:'#3b82f6'},
  };

  function getTier(score) {
    if (!score||score===0) return 'not_started';
    if (score<=33) return 'beginning';
    if (score<=55) return 'developing';
    if (score<=75) return 'approaching';
    if (score<=89) return 'confident';
    return 'mastered';
  }

  let currentUser=null, currentProfile=null, allProgress={}, upcomingAssessments=[], scheduleStatuses={};
  let _assignFilter = 'all'; // 'all' | 'active' | 'completed' | 'expired'
  let _currentRole = 'student'; // cached after auth
  let _dataReady=false;

  // ── TAB SWITCHING ─────────────────────────────────────────────────────────────
  window.switchTab = (name, btn) => {
    document.querySelectorAll('.progress-panel').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('.progress-tab').forEach(b=>b.classList.remove('active'));
    document.getElementById(`panel-${name}`).classList.add('active');
    btn.classList.add('active');
    if (_dataReady) renderTab(name);
  };

  function renderTab(name) {
    if (name==='overview')     renderOverview();
    if (name==='modules')      renderModules();
    if (name==='insights')     renderInsights();
    if (name==='upcoming')     renderUpcoming();
    if (name==='history')      renderHistory();
    if (name==='assignments')  renderAssignments();
  }

  // History state
  let _historyLastDoc = null;
  let _historyHasMore = false;
  let _historyLoaded = false;

  // ── AUTH & DATA LOAD ─────────────────────────────────────────────────────────
  onAuthChange(async user => {
    if (!user) { window.location.href='login.html?redirect=progress.html'; return; }
    currentUser=user;
    window.currentUser=user;
    renderHeader(user);

    // Load all data in parallel
    const [profile, progress, role] = await Promise.all([
      getUserProfile(user.uid),
      getAllProgress(user.uid),
      getUserRole(user.email),
    ]);
    currentProfile=profile;
    allProgress=progress;
    window.currentProfile=profile;

    // Staff nav
    const wrap=document.getElementById('staff-nav-links');
    if (wrap && ['teacher','admin','superadmin'].includes(role)) {
      wrap.style.display='flex';
      document.getElementById('nav-teacher-link').style.display='inline-flex';
    }
    if (['admin','superadmin'].includes(role)) document.getElementById('nav-admin-link').style.display='inline-flex';
    if (role==='superadmin') document.getElementById('nav-superadmin-link').style.display='inline-flex';

    // Load upcoming assessments in background — non-blocking
    if (profile?.class) {
      getUpcomingAssessmentsForStudent(profile.class)
        .then(a => { upcomingAssessments = a; })
        .catch(() => {});
    }

    _currentRole = role;
    _dataReady = true;
    renderTab('overview');

    // Load schedule statuses in background — non-blocking
    if (profile?.yearGroup) {
      Promise.all(Object.entries(MODULE_META).map(([id, meta]) => {
        const subj = meta.subject.charAt(0).toUpperCase() + meta.subject.slice(1);
        return getModuleScheduleStatus(profile.yearGroup, subj, id.toUpperCase())
          .then(s => ({ id, status: s })).catch(() => ({ id, status: 'unknown' }));
      })).then(results => {
        results.forEach(({ id, status }) => { scheduleStatuses[id] = status; });
      }).catch(() => {});
    }
  });

  // ── HEADER ───────────────────────────────────────────────────────────────────
  function renderHeader(user) {
    const header=document.getElementById('user-header');
    const avatar=user.photoURL
      ?`<img src="${user.photoURL}" class="user-avatar" alt="Profile">`
      :`<div class="user-avatar-placeholder">${user.displayName?.[0]||'?'}</div>`;
    header.innerHTML=`${avatar}<div class="user-info"><h1>${user.displayName||'Student'}</h1><p>${user.email}</p></div><button class="btn-signout" onclick="handleSignOut()">Sign out</button>`;
  }

  // ── OVERVIEW TAB ─────────────────────────────────────────────────────────────
  function renderOverview() {
    const panel=document.getElementById('panel-overview');
    let totalMocks=0, totalScore=0, totalPossible=0, allMocks=[], totalAttempts=0;
    const subjectScores={biology:[],chemistry:[],physics:[]};

    Object.entries(allProgress).forEach(([id,data])=>{
      const meta=MODULE_META[id];
      if (!meta) return;
      if (data.mocks) {
        totalMocks+=data.mocks.length;
        data.mocks.forEach(m=>{ totalScore+=m.score; totalPossible+=m.total; allMocks.push({...m,moduleId:id}); });
      }
      Object.values(data.rag||{}).forEach(e=>{
        const s=typeof e==='object'?(e?.score??0):0;
        if (s>0) { subjectScores[meta.subject].push(s); totalAttempts+=(e?.attempts||0); }
      });
    });

    const avgPct=totalPossible>0?Math.round((totalScore/totalPossible)*100):0;
    allMocks.sort((a,b)=>new Date(b.date)-new Date(a.date));

    // Decay warnings
    const decayItems=[];
    Object.entries(allProgress).forEach(([id,data])=>{
      Object.entries(data.rag||{}).forEach(([topic,e])=>{
        if (typeof e!=='object'||!e.lastActivity) return;
        const days=Math.floor((Date.now()-new Date(e.lastActivity).getTime())/86400000);
        if (days>7&&(e.score||0)>0) decayItems.push({id,topic,days,score:e.score||0});
      });
    });
    decayItems.sort((a,b)=>b.days-a.days);

    // Subject avg
    function subjAvg(arr){ return arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):0; }
    const bAvg=subjAvg(subjectScores.biology);
    const cAvg=subjAvg(subjectScores.chemistry);
    const pAvg=subjAvg(subjectScores.physics);

    panel.innerHTML=`
      <!-- Exam target — auto-derived from schedule/assessments, editable as fallback -->
      <div class="target-card">
        <label>🎯 Currently revising for:</label>
        <span id="exam-target-auto" style="font-family:'Nunito',sans-serif;font-weight:800;font-size:0.88rem;color:var(--navy);flex:1">${autoExamTarget(currentProfile)}</span>
        <select class="target-select" id="exam-target" style="display:none">
          <option value="">-- Select your exam --</option>
          <option value="y9" ${currentProfile?.examTarget==='y9'?'selected':''}>Year 9 End of Year Test</option>
          <option value="y10" ${currentProfile?.examTarget==='y10'?'selected':''}>Year 10 End of Year — Paper 1</option>
          <option value="y11" ${currentProfile?.examTarget==='y11'?'selected':''}>Year 11 GCSE — Full Papers</option>
        </select>
        <button class="target-save" onclick="toggleExamTargetEdit()" style="background:none;border:1.5px solid var(--border);color:var(--subtext);font-size:0.75rem">Edit</button>
        <span class="target-saved" id="target-saved">✅ Saved!</span>
      </div>

      <!-- Summary stats -->
      <div class="summary-grid" style="margin-bottom:1.5rem">
        <div class="summary-card"><div class="summary-number">${totalMocks}</div><div class="summary-label">Mocks completed</div></div>
        <div class="summary-card"><div class="summary-number">${avgPct}%</div><div class="summary-label">Average score</div></div>
        <div class="summary-card"><div class="summary-number">${Object.keys(allProgress).length}</div><div class="summary-label">Modules started</div></div>
        <div class="summary-card"><div class="summary-number">${totalAttempts}</div><div class="summary-label">Total activities</div></div>
      </div>

      <!-- Subject balance -->
      <div class="section-title">Subject Balance</div>
      <div class="subject-balance" style="margin-bottom:1.5rem">
        ${[['🧬 Biology','#0d9488',bAvg],['🧪 Chemistry','#0ea5e9',cAvg],['⚡ Physics','#f97316',pAvg]].map(([label,colour,avg])=>`
          <div class="balance-card">
            <div class="balance-label" style="color:${colour}">${label}</div>
            <div class="balance-bar-wrap"><div class="balance-bar-fill" style="width:${avg}%;background:${colour}"></div></div>
            <div class="balance-stat">${avg>0?`Avg topic score: ${avg}%`:'No activity yet'}</div>
          </div>`).join('')}
      </div>

      <!-- Decay warnings -->
      ${decayItems.length?`
        <div class="section-title">📉 Topics That Need Attention</div>
        <div class="decay-list" style="margin-bottom:1.5rem">
          ${decayItems.slice(0,6).map(d=>`
            <div class="decay-row">
              <span class="decay-mod">${d.id.toUpperCase()}</span>
              <span class="decay-topic">${d.topic}</span>
              <span class="decay-days">Inactive ${d.days}d</span>
              <a href="module.html?subject=${MODULE_META[d.id]?.subject}&module=${d.id}" class="btn-take-me">Revise now →</a>
            </div>`).join('')}
        </div>`:''}

      <!-- Recent mocks -->
      <div class="section-title">Recent Mini Mocks</div>
      ${allMocks.length===0?`<div class="empty-state"><p>No mini mocks completed yet.</p><p style="margin-top:0.5rem">Head to any module and try the Mini Mock tab!</p></div>`:`
        <div class="mocks-list">
          ${allMocks.slice(0,8).map(m=>{
            const grade=m.pct>=80?['🌟 Excellent','grade-excellent']:m.pct>=60?['👍 Good','grade-good']:m.pct>=40?['📚 Developing','grade-developing']:['💪 Keep Practising','grade-practise'];
            const date=new Date(m.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
            return `<div class="mock-row">
              <div class="mock-module">${MODULE_META[m.moduleId]?.title||m.moduleId}</div>
              <div><div class="mock-score">${m.score}/${m.total}</div><div class="mock-pct">${m.pct}%</div></div>
              <span class="mock-grade ${grade[1]}">${grade[0]}</span>
              <div class="mock-date">${date}</div>
            </div>`;
          }).join('')}
        </div>`}
    `;
  }

  // ── BY MODULE TAB ─────────────────────────────────────────────────────────────
  async function renderModules() {
    const panel=document.getElementById('panel-modules');

    // Determine which modules are relevant: scheduled (current/past) + assessment modules
    const asmtModules=new Set();
    upcomingAssessments.forEach(a=>(a.modules||[]).forEach(m=>asmtModules.add(m.toLowerCase())));

    // A module is shown if: has any progress, or is current/past in schedule, or is in an upcoming assessment
    function isRelevant(id) {
      const status=scheduleStatuses[id];
      if (allProgress[id]) return true;
      if (status==='current'||status==='past') return true;
      if (asmtModules.has(id)) return true;
      return false;
    }

    const subjects=['biology','chemistry','physics'];
    let html='';

    subjects.forEach(subj=>{
      const mods=Object.entries(MODULE_META).filter(([id,m])=>m.subject===subj&&isRelevant(id));
      if (!mods.length) return;
      const subjectLabel=subj.charAt(0).toUpperCase()+subj.slice(1);
      const emoji=subj==='biology'?'🧬':subj==='physics'?'⚡':'🧪';
      html+=`<div style="font-family:'Nunito',sans-serif;font-weight:900;font-size:0.85rem;color:var(--subtext);text-transform:uppercase;letter-spacing:0.06em;margin:1.25rem 0 0.5rem">${emoji} ${subjectLabel}</div>`;
      mods.forEach(([id,meta])=>{
        const data=allProgress[id]||{};
        const rag=data.rag||{};
        const status=scheduleStatuses[id];
        const isAsmt=asmtModules.has(id);
        let flag='';
        if (status==='current') flag=`<span class="schedule-flag flag-current">📗 Studying now</span>`;
        else if (status==='past') flag=`<span class="schedule-flag flag-past">🔄 Consolidation</span>`;
        if (isAsmt) flag+=`<span class="schedule-flag flag-asmt" style="margin-left:0.25rem">📋 In upcoming test</span>`;

        // Topic stats
        const topicEntries=Object.entries(rag);
        let sumScore=0, topicCount=0, weakCount=0;
        topicEntries.forEach(([,e])=>{
          const s=typeof e==='object'?(e?.score??0):0;
          sumScore+=s; topicCount++;
          if (['not_started','beginning','developing'].includes(getTier(s))) weakCount++;
        });
        const avgScore=topicCount>0?Math.round(sumScore/topicCount):0;
        const tier=getTier(avgScore);
        const mocks=data.mocks||[];

        // Topic detail rows
        const topicRows=topicEntries.map(([topic,e])=>{
          const s=typeof e==='object'?(e?.score??0):0;
          const t=getTier(s);
          const days=e?.lastActivity?Math.floor((Date.now()-new Date(e.lastActivity).getTime())/86400000):null;
          const decayFlag=days>7&&s>0?`<span style="font-size:0.6rem;color:#c2410c;font-weight:700">📉 ${days}d</span>`:'';
          return `<div class="topic-expand-row">
            <span class="topic-name">${topic}</span>
            <div class="topic-bar-wrap"><div class="topic-bar-fill" style="width:${s}%;background:${TIER_META[t].colour}"></div></div>
            <span class="topic-tier-label">${TIER_META[t].emoji} ${TIER_META[t].label}</span>
            ${decayFlag}
          </div>`;
        }).join('');

        html+=`<div class="module-expand-card" id="mec-${id}">
          <div class="module-expand-header" onclick="toggleModuleCard('${id}')">

  // ── INSIGHTS TAB ─────────────────────────────────────────────────────────────
  async function renderInsights() {

  function buildBullets() {
    const bullets=[];

    // Upcoming assessment warning
    if (upcomingAssessments.length) {
      const next=upcomingAssessments[0];
      const days=next.date?Math.ceil((new Date(next.date)-new Date())/86400000):null;
      const daysText=days===0?'today':days===1?'tomorrow':`in ${days} days`;
      const weakTopics=[];
      (next.modules||[]).forEach(m=>{
        const rag=allProgress[m.toLowerCase()]?.rag||{};
        const pts=next.partialTopics?.[m];
        const topics=pts?.length?pts:Object.keys(rag);
        topics.forEach(t=>{
          const e=rag[t];
          const s=typeof e==='object'?(e?.score??0):0;
          if (['not_started','beginning','developing'].includes(getTier(s))) weakTopics.push(`${m}: ${t}`);
        });
      });
      bullets.push({
        icon:'📋',
        text:`Your next assessment is <strong>${next.label}</strong> ${daysText}.${weakTopics.length?` You have <strong>${weakTopics.length} weak topic${weakTopics.length!==1?'s':''}</strong> to focus on.`:''}`,
        link:`progress.html#upcoming`
      });
    }

    // Decaying topics
    const decaying=[];
    Object.entries(allProgress).forEach(([id,data])=>{
      Object.entries(data.rag||{}).forEach(([topic,e])=>{
        if (typeof e!=='object'||!e.lastActivity) return;
        const days=Math.floor((Date.now()-new Date(e.lastActivity).getTime())/86400000);
        if (days>7&&(e.score||0)>30) decaying.push({id,topic,days});
      });
    });
    if (decaying.length) {
      const worst=decaying.sort((a,b)=>b.days-a.days)[0];
      bullets.push({icon:'📉',text:`<strong>${worst.topic}</strong> in ${worst.id.toUpperCase()} hasn't been practised in <strong>${worst.days} days</strong> — it may be fading. A quick flashcard run will help keep it fresh!`,link:`module.html?subject=${MODULE_META[worst.id]?.subject}&module=${worst.id}`});
    }

    // Current module encouragement
    const current=Object.entries(scheduleStatuses).find(([,s])=>s==='current');
    if (current) {
      const [id]=current;
      const rag=allProgress[id]?.rag||{};
      const topics=Object.keys(rag).length;
      bullets.push({icon:'📗',text:`You're currently studying <strong>${MODULE_META[id]?.title}</strong>. ${topics>0?`You've tracked ${topics} topics — keep it up!`:'Head over and start tracking your progress!'}`,link:`module.html?subject=${MODULE_META[id]?.subject}&module=${id}`});
    }

    // Weakest subject
    const subjectAvgs={biology:[],chemistry:[],physics:[]};
    Object.entries(allProgress).forEach(([id,data])=>{
      const subj=MODULE_META[id]?.subject;
      if (!subj) return;
      Object.values(data.rag||{}).forEach(e=>{ const s=typeof e==='object'?(e?.score??0):0; if(s>0) subjectAvgs[subj].push(s); });
    });
    const withData=Object.entries(subjectAvgs).filter(([,v])=>v.length>0);
    if (withData.length>1) {
      const weakest=withData.sort((a,b)=>avg(a[1])-avg(b[1]))[0];
      const strongest=withData.sort((a,b)=>avg(b[1])-avg(a[1]))[0];
      if (weakest[0]!==strongest[0]) {
        const wLabel=weakest[0].charAt(0).toUpperCase()+weakest[0].slice(1);
        bullets.push({icon:'⚠️',text:`Your <strong>${wLabel}</strong> scores are your lowest on average. It's worth dedicating a bit more time there — even 10 minutes on the keywords game makes a difference!`,link:`${weakest[0]}.html`});
      }
    }

    // Mastered topics celebration
    let masteredCount=0;
    Object.values(allProgress).forEach(d=>Object.values(d.rag||{}).forEach(e=>{ if(typeof e==='object'&&(e?.score??0)>=90) masteredCount++; }));
    if (masteredCount>0) bullets.push({icon:'💙',text:`You've mastered <strong>${masteredCount} topic${masteredCount!==1?'s':''}</strong> — fantastic work! Keep revisiting them so they stay at the top.`});

    if (!bullets.length) bullets.push({icon:'👋',text:'Welcome! Start by trying a Mini Mock or some Flashcards in any module. Your personalised insights will appear here as you build up your scores.',link:'index.html'});

    return bullets;
  }

  function avg(arr){ return arr.length?Math.round(arr.reduce((a,b)=>a+b,0)/arr.length):0; }

  // Auto-derive what the student is revising for based on schedule + assessments
  function autoExamTarget(profile) {
    // First: use upcoming assessment if one exists
    if (upcomingAssessments.length) {
      const next = upcomingAssessments[0];
      const days = next.date ? Math.ceil((new Date(next.date) - new Date()) / 86400000) : null;
      const daysStr = days !== null ? (days === 0 ? 'today' : days === 1 ? 'tomorrow' : `in ${days} days`) : '';
      const mods = (next.modules||[]).join(', ');
      return `${next.subject} — ${next.label}${mods?' ('+mods+')':''}${daysStr?' · '+daysStr:''}`;
    }
    // Second: use current schedule module
    const current = Object.entries(scheduleStatuses).find(([,s])=>s==='current');
    if (current) {
      const meta = MODULE_META[current[0]];
      return `${meta?.title || current[0].toUpperCase()} — currently on schedule`;
    }
    // Third: use manually saved exam target
    const targetLabels = { y9:'Year 9 End of Year Test', y10:'Year 10 End of Year — Paper 1', y11:'Year 11 GCSE — Full Papers' };
    if (profile?.examTarget) return targetLabels[profile.examTarget] || 'Not set';
    return 'Not set — your teacher will update this';
  }

  function findWeakestModule() {
    let worst=null, worstScore=101;
    Object.entries(allProgress).forEach(([id,data])=>{
      const scores=Object.values(data.rag||{}).map(e=>typeof e==='object'?(e?.score??0):0).filter(s=>s>0);
      if (!scores.length) return;
      const a=avg(scores);
      if (a<worstScore){ worstScore=a; worst=id; }
    });
    return worst;
  }

  window.getAIInsight = async () => {
    const btn=document.getElementById('btn-get-insight');
    const area=document.getElementById('ai-insight-area');
    if (!btn||!area) return;
    btn.disabled=true;
    area.innerHTML=`<div class="ai-insight-wrap"><div class="ai-loading"><div class="ai-spinner"></div> Generating your personalised insight…</div></div>`;

    // Build context for the AI
    const modulesSummary=Object.entries(allProgress).map(([id,data])=>{
      const rag=data.rag||{};
      const topicSummary=Object.entries(rag).map(([t,e])=>{
        const s=typeof e==='object'?(e?.score??0):0;
        return `${t}: ${getTier(s)} (${s}%)`;
      }).join(', ');
      const mocks=data.mocks||[];
      const avgM=mocks.length?Math.round(mocks.reduce((a,m)=>a+m.pct,0)/mocks.length):0;
      return `${id.toUpperCase()} (${MODULE_META[id]?.title}): mock avg ${avgM}%, topics: ${topicSummary||'none tracked'}`;
    }).join('\n');

    const asmtContext=upcomingAssessments.map(a=>`${a.subject} ${a.label} on ${a.date} covering ${(a.modules||[]).join(', ')}`).join('; ');
    const schedContext=Object.entries(scheduleStatuses).filter(([,s])=>s==='current').map(([id])=>`${id.toUpperCase()} (${MODULE_META[id]?.title})`).join(', ');

    const prompt=`You are a friendly, encouraging GCSE science revision assistant for a student at Streetly Academy. Write a short personalised insight paragraph (3-5 sentences) based on their progress data. Be warm and positive — acknowledge effort, give specific actionable advice, and avoid any language that feels like a telling off. Focus on what they can do next, not what they haven't done. Do not use markdown formatting, headings, or bullet points — just plain flowing text.

Student progress:
${modulesSummary||'No activity recorded yet.'}

Currently studying: ${schedContext||'Not set'}
Upcoming assessments: ${asmtContext||'None set'}
Year group: Year ${currentProfile?.yearGroup||'unknown'}

Write a helpful, encouraging insight for this student. Mention specific modules or topics by name where relevant. Keep it under 100 words.`;

    try {
      const res = await fetch('/.netlify/functions/mark-answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          _insightMode: true,
          prompt,
        })
      });
      const data = await res.json();
      // Netlify function returns { feedback } for marking, or { insight } for insight mode
      const text = data.insight || data.content?.map(c=>c.text||'').join('') || 'Could not generate insight.';

      // Save cooldown timestamp and persist insight text
      await Promise.all([
        saveInsightTimestamp(currentUser.uid),
        saveLastInsight(currentUser.uid, cleanText),
      ]);

      // Strip markdown formatting the AI sometimes adds
      const cleanText = text
        .replace(/^#+\s+.*/gm, '')   // remove # headings
        .replace(/\*\*(.*?)\*\*/g, '$1')  // remove **bold**
        .replace(/\*(.*?)\*/g, '$1')       // remove *italic*
        .trim();

      area.innerHTML=`<div class="ai-insight-wrap">
        <div class="ai-insight-header">✨ Your Personalised Insight</div>
        <div class="ai-insight-body">${cleanText}</div>
      </div>`;
    } catch(e) {
      area.innerHTML=`<div class="ai-insight-wrap"><div class="ai-insight-body">Sorry, couldn't generate an insight right now. Try again in a moment.</div></div>`;
      btn.disabled=false;
    }
  };

          ${topicRows.join('')}

  // ── HISTORY TAB ───────────────────────────────────────────────────────────────
  const TYPE_LABELS = { mock:'Mini Mock', paper:'Practice Paper', words:'Keywords Game', flashcard:'Flashcards' };
  const TYPE_CLASSES = { mock:'htype-mock', paper:'htype-paper', words:'htype-words', flashcard:'htype-flashcard' };

  function groupIntoSessions(entries) {
    // Group entries within 30 minutes of each other as one session
    const sessions = [];
    let current = null;
    entries.forEach(e => {
      const ts = new Date(e.timestamp).getTime();
      if (!current || ts < current.end - 30*60*1000) {
        current = { date: new Date(e.timestamp), entries: [e], end: ts };
        sessions.push(current);
      } else {
        current.entries.push(e);
        current.end = Math.max(current.end, ts);
      }
    });
    return sessions;
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diffDays = Math.floor((now - d) / 86400000);
    const time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    if (diffDays === 0) return `Today ${time}`;
    if (diffDays === 1) return `Yesterday ${time}`;
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) + ` ${time}`;
  }

  function historyEntryHTML(e) {
    const typeCls = TYPE_CLASSES[e.type] || 'htype-mock';
    const typeLabel = TYPE_LABELS[e.type] || e.type;
    const modLabel = e.moduleTitle || (e.moduleId||'').toUpperCase();
    const hasTopics = e.topics?.length > 0;
    return `<div class="history-row" onclick="openReview('${e.id}')">
      <span class="history-type-badge ${typeCls}">${typeLabel}</span>
      <div>
        <div class="history-mod">${modLabel}</div>
        ${e.subjectId ? `<div style="font-size:0.7rem;color:var(--subtext)">${e.subjectId.charAt(0).toUpperCase()+e.subjectId.slice(1)}</div>` : ''}
      </div>
      <div style="margin-left:auto;text-align:right">
        <div class="history-score" style="color:${e.pct>=70?'#16a34a':e.pct>=40?'#d97706':'#dc2626'}">${e.score ?? ''}${e.total ? `/${e.total}` : ''}</div>
        <div class="history-pct">${e.pct != null ? e.pct+'%' : ''}</div>
      </div>
      <div class="history-time">${formatTime(e.timestamp)}</div>
      ${hasTopics ? `<span style="font-size:0.68rem;background:#f0f4ff;color:var(--navy);border-radius:6px;padding:0.1rem 0.4rem;font-weight:700">Review →</span>` : ''}
    </div>`;
  }

  async function renderHistory(loadMore = false) {
    const panel = document.getElementById('panel-history');
    if (!loadMore) {
      panel.innerHTML = '<div class="loading-state">Loading activity history...</div>';
      _historyLastDoc = null;
      _historyLoaded = false;
    }

    try {
      const { entries, hasMore, lastDoc } = await getActivityLog(currentUser.uid, 30, loadMore ? _historyLastDoc : null);
      _historyLastDoc = lastDoc;
      _historyHasMore = hasMore;

      if (!loadMore && !entries.length) {
        panel.innerHTML = `<div class="empty-state"><p>No activity recorded yet.</p><p style="margin-top:0.5rem;font-size:0.82rem">Complete a Mini Mock, Keywords Game or Flashcards round and it will appear here.</p></div>`;
        return;
      }

      // Store entries for review lookup
      if (!loadMore) window._historyCache = {};
      entries.forEach(e => { window._historyCache[e.id] = e; });

      // Group into sessions
      const sessions = groupIntoSessions(entries);

      const html = sessions.map(session => {
        const dateLabel = session.date.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        const rowsHtml = session.entries.map(historyEntryHTML).join('');
        return `<div class="session-group">
          <div class="session-date-label">${dateLabel}</div>
          ${rowsHtml}
        </div>`;
      }).join('');

      if (loadMore) {
        // Append before load-more button
        const btn = document.getElementById('history-load-more');
        if (btn) btn.insertAdjacentHTML('beforebegin', html);
      } else {
        panel.innerHTML = `
          <div class="section-title">🕐 Activity History</div>
          ${html}
          ${hasMore ? `<button class="btn-load-more" id="history-load-more" onclick="renderHistory(true)">Load more →</button>` : ''}
        `;
      }

      // Update load-more button
      if (loadMore) {
        const btn = document.getElementById('history-load-more');
        if (!hasMore && btn) btn.remove();
      }
    } catch(e) {
      panel.innerHTML = '<div class="empty-state">Could not load history. Try again.</div>';
      console.log('[History]', e);
    }
  }

  window.openReview = (id) => {
    const e = window._historyCache?.[id];
    if (!e || !e.topics?.length) return;
    const typeLabel = TYPE_LABELS[e.type] || e.type;

    const topicRows = e.topics.map(t => {
      const pct = t.marks > 0 ? t.awarded / t.marks : (t.correct ? 1 : 0);

      const icon = pct >= 1 ? '✅' : pct > 0 ? '🟡' : '❌';
      return `<div class="review-topic-row">
        <span class="review-topic-name">${t.topic}</span>
        <span class="review-marks ${cls}">${icon} ${t.awarded ?? (t.correct?1:0)}/${t.marks ?? 1}</span>

    }).join('');

    document.getElementById('review-modal-content').innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
        <h3>${typeLabel} — ${modLabel}</h3>
        <button onclick="closeReview()" style="background:none;border:none;cursor:pointer;font-size:1.3rem;color:var(--subtext)">✕</button>
      </div>
      <div style="font-size:0.78rem;color:var(--subtext);margin-bottom:1rem">${dateStr} · Score: <strong>${e.score ?? ''}${e.total ? '/'+e.total : ''} (${e.pct ?? ''}%)</strong></div>
      ${topicRows}
      <div style="margin-top:1rem;text-align:center">
        <a href="module.html?subject=${e.subjectId}&module=${e.moduleId}" class="btn-take-me">Go to ${(e.moduleId||'').toUpperCase()} to revise →</a>
      </div>
    `;
    document.getElementById('review-overlay').style.display = 'flex';
  };

  window.closeReview = () => { document.getElementById('review-overlay').style.display = 'none'; };

  // ── ASSIGNMENTS TAB ─────────────────────────────────────────────────────────
  const TYPE_LABELS_A = { mini_mock:'Mini Mock', flashcards:'Flashcards', keywords:'Keywords Game', paper:'Practice Paper', custom:'Custom Task' };

  window.setAssignFilter = (filter, btn) => {
    _assignFilter = filter;
    document.querySelectorAll('.assign-filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAssignments(true); // re-render without reloading
  };

  let _assignmentsCache = null;
  let _completionsCache = {};

  async function renderAssignments(fromCache = false) {
    const panel = document.getElementById('panel-assignments');
    if (!currentProfile?.class) {
      const isStaff = ['teacher','admin','superadmin'].includes(_currentRole);
      panel.innerHTML = `<div class="assign-empty">
        <div style="font-size:2rem;margin-bottom:0.75rem">📋</div>
        <div style="font-family:'Nunito',sans-serif;font-weight:800;font-size:0.95rem;color:var(--navy);margin-bottom:0.4rem">${isStaff ? 'No assignments to display' : 'No class set'}</div>
        <div>${isStaff ? 'Assignments are set for student classes. Visit the <a href="teacher.html" style="color:var(--navy);font-weight:700">Teacher Dashboard</a> to manage assignments.' : 'You need to set your class before assignments can be loaded. Use the ⚙️ settings button to set your class.'}</div>
      </div>`;
      return;
    }

    if (!fromCache) {
      panel.innerHTML = '<div class="loading-state">Loading assignments...</div>';
      try {
        const today = new Date().toISOString().split('T')[0];
        const assignments = await getActiveAssignmentsForClass(currentProfile.class);
        const completions = {};
        await Promise.all(assignments.map(async a => {
          try { completions[a.id] = await getMyAssignmentCompletion(a.id, currentUser.uid); }
          catch(e) { completions[a.id] = null; }
        }));
        _assignmentsCache = assignments;
        _completionsCache = completions;
      } catch(e) {
        panel.innerHTML = '<div class="assign-empty">Could not load assignments. Try again.</div>';
        return;
      }
    }

    const today = new Date().toISOString().split('T')[0];
    const all = _assignmentsCache || [];

    if (!all.length) {
      panel.innerHTML = `<div class="assign-empty">
        <div style="font-size:2rem;margin-bottom:0.75rem">🎉</div>
        <div style="font-family:'Nunito',sans-serif;font-weight:800;font-size:0.95rem;color:var(--navy);margin-bottom:0.4rem">No assignments yet</div>
        <div>Your teacher hasn't set any assignments yet. Check back soon!</div>
      </div>`;
      return;
    }

    // Categorise
    const categorised = all.map(a => {
      const isExpired = a.dueDate && a.dueDate < today;
      const comp = _completionsCache[a.id];
      const status = isExpired ? 'expired' : comp ? 'completed' : 'active';
      return { ...a, isExpired, comp, status };
    });

    // Filter
    const filtered = _assignFilter === 'all'
      ? categorised
      : categorised.filter(a => a.status === _assignFilter);

    // Counts for filter buttons
    const counts = { all: categorised.length, active: 0, completed: 0, expired: 0 };
    categorised.forEach(a => counts[a.status]++);

    // Sort: active first, then completed, then expired — within each group by due date
    const order = { active: 0, completed: 1, expired: 2 };
    filtered.sort((a, b) => {
      if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
      return (a.dueDate || '').localeCompare(b.dueDate || '');
    });

    const filterHtml = `<div class="assign-filter-row">
      <button class="assign-filter-btn ${_assignFilter==='all'?'active':''}" onclick="setAssignFilter('all',this)">All (${counts.all})</button>
      <button class="assign-filter-btn ${_assignFilter==='active'?'active':''}" onclick="setAssignFilter('active',this)">Active (${counts.active})</button>
      <button class="assign-filter-btn ${_assignFilter==='completed'?'active':''}" onclick="setAssignFilter('completed',this)">Completed ✅ (${counts.completed})</button>
      <button class="assign-filter-btn ${_assignFilter==='expired'?'active':''}" onclick="setAssignFilter('expired',this)">Expired (${counts.expired})</button>
    </div>`;

    if (!filtered.length) {
      panel.innerHTML = filterHtml + `<div class="assign-empty">No assignments in this category.</div>`;
      return;
    }

    const cardsHtml = filtered.map(a => {
      const daysLeft = a.dueDate ? Math.ceil((new Date(a.dueDate) - new Date()) / 86400000) : null;
      const due = a.dueDate ? new Date(a.dueDate + 'T12:00:00').toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' }) : '';
      const typeLabel = TYPE_LABELS_A[a.type] || a.type;
      const modLabel = a.moduleId ? a.moduleId.toUpperCase() + ' — ' : '';
      const subjLabel = a.subject ? a.subject.charAt(0).toUpperCase() + a.subject.slice(1) : '';

      // Status label
      const labelText = a.isExpired ? 'Expired' : a.comp ? 'Completed ✅' : 'Active Assignment';
      const labelClass = a.isExpired ? 'lbl-expired' : a.comp ? 'lbl-completed' : 'lbl-active';
      const cardClass = a.isExpired ? 'status-expired' : a.comp ? 'status-completed' : 'status-active';

      // Urgency
      let urgencyText = '', urgencyClass = '';
      if (a.isExpired) { urgencyText = '🔴 Expired'; urgencyClass = 'expired'; }
      else if (daysLeft === 0) { urgencyText = '🔴 Due today'; urgencyClass = 'urgent'; }
      else if (daysLeft === 1) { urgencyText = '🟡 Due tomorrow'; urgencyClass = 'soon'; }
      else if (daysLeft <= 3) { urgencyText = `🟡 Due ${due}`; urgencyClass = 'soon'; }
      else if (due) { urgencyText = `🟢 Due ${due}`; urgencyClass = 'fine'; }

      // Completion badge
      const scoreBadge = a.comp ? `<div class="assign-score">
        <div class="assign-score-num">${a.comp.bestPct || 0}%</div>
        <div class="assign-score-sub">Best score</div>
        <div class="assign-score-sub">${a.comp.attempts} attempt${a.comp.attempts !== 1 ? 's' : ''}</div>
      </div>` : '';

      // Go button
      let goBtn = '';
      if (a.type === 'custom') {
        goBtn = a.customText ? `<span style="font-size:0.78rem;color:var(--subtext);font-weight:600;flex-shrink:0;max-width:200px;align-self:center">${a.customText}</span>` : '';
      } else if (a.link && a.link !== '#') {
        const btnClass = a.isExpired ? 'btn-go-late' : a.comp ? 'btn-go-retry' : 'btn-go-active';
        const btnText = a.comp ? 'Try again →' : a.isExpired ? 'Late submission →' : 'Go →';
        goBtn = `<a href="${a.link}" class="btn-assign-go ${btnClass}">${btnText}</a>`;
      }

      return `<div class="assign-card ${cardClass}">
        <div class="assign-info">
          <div class="assign-label ${labelClass}">${labelText}</div>
          <div class="assign-title">${subjLabel ? subjLabel + ' — ' : ''}${modLabel}${a.title}</div>
          ${a.note ? `<div style="font-size:0.78rem;color:var(--subtext);margin-top:0.2rem;font-style:italic">${a.note}</div>` : ''}
          <div class="assign-meta">
            <span class="assign-type-pill">${typeLabel}</span>
            ${urgencyText ? `<span class="assign-urgency ${urgencyClass}">${urgencyText}</span>` : ''}
          </div>
        </div>
        ${scoreBadge}
        ${goBtn}
      </div>`;
    }).join('');

    panel.innerHTML = filterHtml + `<div class="section-title" style="margin-bottom:0.75rem">📋 My Assignments</div>` + cardsHtml;
  }

  window.handleSignOut = async () => { await signOutUser(); window.location.href='index.html'; };

  window.saveTarget = async () => {
    if (!currentUser) return;
    const val=document.getElementById('exam-target').value;
    await updateExamTarget(currentUser.uid, val, null);
    const saved=document.getElementById('target-saved');
    saved.style.display='inline';
    setTimeout(()=>{saved.style.display='none';},2000);
  };
</script>

<!-- REVIEW MODAL -->
<div id="review-overlay" class="review-overlay" style="display:none" onclick="if(event.target===this)closeReview()">
  <div class="review-modal" id="review-modal-content"></div>
</div>

<!-- SETTINGS OVERLAY + DRAWER -->
<div class="settings-overlay hidden" id="settings-overlay" onclick="closeSettings()"></div>
<div class="settings-drawer hidden" id="settings-drawer">
  <div class="drawer-header">
    <h2>⚙️ Settings</h2>
    <button class="drawer-close" onclick="closeSettings()">✕</button>
  </div>
  <div class="drawer-body">
    <div class="drawer-section-title">My Class</div>
    <div class="current-class-badge" id="drawer-class-display">—</div>
    <div style="font-family:'Nunito',sans-serif;font-weight:800;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--subtext);margin-bottom:0.6rem">Change year group</div>
    <div class="year-grid-s" id="drawer-year-grid">
      <button class="year-btn-s" onclick="selectYearDrawer(9, this)">Year 9</button>
      <button class="year-btn-s" onclick="selectYearDrawer(10, this)">Year 10</button>
      <button class="year-btn-s" onclick="selectYearDrawer(11, this)">Year 11</button>
    </div>
    <div id="drawer-class-step" style="display:none">
      <div style="font-family:'Nunito',sans-serif;font-weight:800;font-size:0.8rem;text-transform:uppercase;letter-spacing:0.07em;color:var(--subtext);margin-bottom:0.6rem">Select class</div>
      <div class="class-grid-s" id="drawer-class-grid"></div>
    </div>
    <button class="btn-drawer-confirm" id="drawer-confirm-btn" disabled onclick="confirmClassDrawer()">Update Class</button>
    <hr class="drawer-divider">
    <div class="drawer-section-title">Account</div>
    <button onclick="handleSignOut()" style="width:100%;background:none;border:1.5px solid var(--border);color:var(--subtext);font-family:'Nunito',sans-serif;font-weight:700;font-size:0.8rem;padding:0.5rem;border-radius:8px;cursor:pointer;margin-top:0.25rem">Sign out</button>
  </div>
</div>

<script type="module">
  import { saveClass } from './firebase.js';

  const CLASSES = {
    9:  ['9S1','9S2','9S3','9S4','9S5','9N1','9N2','9N3','9N4','9N5'],
    10: ['10S1','10S2','10S3','10S4','10S5','10N1','10N2','10N3','10N4','10N5'],
    11: ['11S1','11S2','11S3','11S4','11S5','11N1','11N2','11N3','11N4','11N5'],
  };

  let selectedYearDrawer = null;
  let selectedClassDrawer = null;

  // Use already-loaded profile from main script — no extra Firestore read needed
  function updateDrawerClassDisplay() {
    const profile = window.currentProfile;
    document.getElementById('drawer-class-display').textContent = profile?.class || 'Not set';
  }

  // Poll briefly in case main script hasn't set currentProfile yet
  const waitForUser = setInterval(() => {
    if (!window.currentProfile) return;
    clearInterval(waitForUser);
    updateDrawerClassDisplay();
  }, 100);

  window.openSettings = () => {
    updateDrawerClassDisplay();
    document.getElementById('settings-overlay').classList.remove('hidden');
    document.getElementById('settings-drawer').classList.remove('hidden');
    selectedYearDrawer = null;
    selectedClassDrawer = null;
    document.getElementById('drawer-class-step').style.display = 'none';
    document.getElementById('drawer-confirm-btn').disabled = true;
    document.querySelectorAll('.year-btn-s').forEach(b => b.classList.remove('selected'));
  };

  window.closeSettings = () => {
    document.getElementById('settings-overlay').classList.add('hidden');
    document.getElementById('settings-drawer').classList.add('hidden');
  };

  window.selectYearDrawer = (year, btn) => {
    selectedYearDrawer = year;
    selectedClassDrawer = null;
    document.querySelectorAll('.year-btn-s').forEach(b => b.classList.remove('selected'));
    if (btn) btn.classList.add('selected');
    const grid = document.getElementById('drawer-class-grid');
    grid.innerHTML = CLASSES[year].map(cls =>
      `<button class="class-btn-s" onclick="selectClassDrawer('${cls}', this)">${cls}</button>`
    ).join('');
    document.getElementById('drawer-class-step').style.display = 'block';
    document.getElementById('drawer-confirm-btn').disabled = true;
  };

  window.selectClassDrawer = (cls, btn) => {
    selectedClassDrawer = cls;
    document.querySelectorAll('.class-btn-s').forEach(b => b.classList.remove('selected'));
    if (btn) btn.classList.add('selected');
    document.getElementById('drawer-confirm-btn').disabled = false;
  };

  window.confirmClassDrawer = async () => {
    if (!window.currentUser || !selectedClassDrawer) return;
    await saveClass(window.currentUser.uid, selectedClassDrawer);
    // Update cached profile so drawer shows correct value immediately
    if (window.currentProfile) {
      window.currentProfile.class = selectedClassDrawer;
      window.currentProfile.yearGroup = parseInt(selectedClassDrawer.match(/^(\d+)/)?.[1]) || null;
    }
    document.getElementById('drawer-class-display').textContent = selectedClassDrawer;
    closeSettings();
    location.reload();
  };
</script>
</body>
</html>
