<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revision — Streetly Science Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #1a2a4f;
      --navy-dark: #0f1d3d;
      --red: #c8202c;
      --gold: #d4a534;
      --bg: #f5f6fa;
      --text: #1a2a4f;
      --subtext: #5a6885;
      --border: #e2e6f0;
      --card: #ffffff;
      --accent: #0d9488;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── TOPNAV ── */
    .topnav { background: var(--navy-dark); padding: 0.7rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .topnav a { color: #94a3b8; text-decoration: none; font-size: 0.875rem; font-weight: 600; transition: color 0.2s; }
    .topnav a:hover { color: white; }
    .topnav-title { color: white; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.95rem; margin-left: auto; }

    /* ── HERO ── */
    .hero {
      background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
      color: white;
      padding: 2rem 1.5rem 1.5rem;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255,255,255,0.03);
    }
    .hero-inner { max-width: 820px; margin: 0 auto; position: relative; }
    .hero-breadcrumb { font-size: 0.78rem; color: #94a3b8; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem; }
    .hero-breadcrumb a { color: #94a3b8; text-decoration: none; }
    .hero-breadcrumb a:hover { color: white; }
    .hero-module-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 40px; height: 40px; border-radius: 10px;
      font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 0.9rem;
      color: white; margin-bottom: 0.75rem; flex-shrink: 0;
    }
    .hero-top { display: flex; align-items: center; gap: 0.85rem; margin-bottom: 0.5rem; }
    .hero h1 { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.75rem; line-height: 1.2; }
    .hero-sub { color: #c5cee8; font-size: 0.9rem; margin-top: 0.3rem; }

    /* ── TOPIC NAV ── */
    .topic-nav { background: white; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
    .topic-nav-inner { max-width: 820px; margin: 0 auto; padding: 0 1.5rem; display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
    .topic-nav-inner::-webkit-scrollbar { display: none; }
    .topic-nav-btn {
      padding: 0.85rem 1.1rem; border: none; background: none;
      font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.8rem;
      color: var(--subtext); cursor: pointer; white-space: nowrap;
      border-bottom: 3px solid transparent; transition: all 0.15s;
    }
    .topic-nav-btn:hover { color: var(--navy); }
    .topic-nav-btn.active { color: var(--navy); border-bottom-color: var(--navy); }

    /* ── MAIN CONTENT ── */
    .content-wrap { max-width: 820px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

    /* ── SECTION BLOCKS ── */
    .topic-section { margin-bottom: 2rem; }
    .topic-section h2 {
      font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.2rem;
      color: var(--navy); margin-bottom: 0.75rem;
      padding-bottom: 0.5rem; border-bottom: 2px solid var(--border);
      display: flex; align-items: center; gap: 0.5rem;
    }
    .topic-section p { font-size: 0.9rem; line-height: 1.75; color: var(--text); margin-bottom: 0.75rem; }
    .topic-section ul, .topic-section ol { padding-left: 1.5rem; margin-bottom: 0.75rem; }
    .topic-section li { font-size: 0.9rem; line-height: 1.7; margin-bottom: 0.25rem; }

    /* ── KEY TERMS ── */
    .key-terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 0.6rem; margin-bottom: 1rem; }
    .key-term {
      background: #f0f4ff; border: 1.5px solid #c7d2fe;
      border-radius: 10px; padding: 0.65rem 0.85rem;
    }
    .key-term-word { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.82rem; color: var(--navy); }
    .key-term-def { font-size: 0.78rem; color: var(--subtext); margin-top: 0.2rem; line-height: 1.5; }

    /* ── CALLOUT BOXES ── */
    .callout { border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 1rem; }
    .callout-tip { background: #f0fdf4; border-left: 4px solid #22c55e; }
    .callout-warn { background: #fefce8; border-left: 4px solid #eab308; }
    .callout-exam { background: #eff6ff; border-left: 4px solid #3b82f6; }
    .callout-label { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.35rem; }
    .callout-tip .callout-label { color: #16a34a; }
    .callout-warn .callout-label { color: #ca8a04; }
    .callout-exam .callout-label { color: #2563eb; }
    .callout p { font-size: 0.85rem; line-height: 1.6; margin: 0; }

    /* ── DIAGRAM AREA ── */
    .diagram-wrap { background: white; border: 1.5px solid var(--border); border-radius: 14px; padding: 1.25rem; margin-bottom: 1.5rem; text-align: center; }
    .diagram-wrap svg { max-width: 100%; height: auto; }
    .diagram-caption { font-size: 0.75rem; color: var(--subtext); margin-top: 0.5rem; font-style: italic; }

    /* ── VIDEO SECTION ── */
    .videos-section { margin-top: 2rem; }
    .videos-section h2 { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1.2rem; color: var(--navy); margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--border); }
    .video-grid { display: flex; flex-direction: column; gap: 0.6rem; }
    .video-card {
      background: white; border: 1.5px solid var(--border); border-radius: 12px;
      padding: 0.85rem 1rem; display: flex; align-items: center; gap: 0.85rem;
      text-decoration: none; color: var(--text); transition: all 0.15s;
    }
    .video-card:hover { border-color: #ef4444; transform: translateX(3px); }
    .video-thumb { width: 42px; height: 42px; background: #fef2f2; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
    .video-info { flex: 1; }
    .video-title { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.82rem; color: var(--navy); }
    .video-channel { font-size: 0.72rem; color: var(--subtext); margin-top: 0.1rem; }
    .video-arrow { color: var(--subtext); font-size: 0.9rem; }

    /* ── LOADING / ERROR ── */
    .loading-state { text-align: center; padding: 3rem; color: var(--subtext); }
    .error-state { text-align: center; padding: 3rem; color: var(--red); }

    /* ── PROGRESS INDICATOR ── */
    .rag-indicator { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.72rem; font-weight: 700; padding: 0.2rem 0.6rem; border-radius: 100px; margin-left: auto; flex-shrink: 0; }

    /* ── QUICK QUIZ ── */
    .quiz-wrap { margin-top: 2rem; background: #f8fafc; border: 2px solid var(--border); border-radius: 16px; padding: 1.5rem; }
    .quiz-title { font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 1rem; color: var(--navy); margin-bottom: 0.25rem; }
    .quiz-subtitle { font-size: 0.8rem; color: var(--subtext); margin-bottom: 1.25rem; }
    .quiz-question { background: white; border: 1.5px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; margin-bottom: 0.85rem; }
    .quiz-q-text { font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.88rem; color: var(--navy); margin-bottom: 0.75rem; }
    .quiz-options { display: flex; flex-direction: column; gap: 0.4rem; }
    .quiz-option { display: flex; align-items: center; gap: 0.65rem; padding: 0.55rem 0.75rem; border: 1.5px solid var(--border); border-radius: 9px; cursor: pointer; transition: all 0.15s; font-size: 0.82rem; background: white; }
    .quiz-option:hover { border-color: var(--navy); background: #f0f4ff; }
    .quiz-option input[type=radio] { flex-shrink: 0; accent-color: var(--navy); }
    .quiz-option.correct { border-color: #16a34a; background: #f0fdf4; color: #14532d; font-weight: 700; }
    .quiz-option.incorrect { border-color: #dc2626; background: #fef2f2; color: #991b1b; }
    .quiz-result-icon { font-size: 1rem; flex-shrink: 0; }
    .btn-quiz-submit { background: var(--navy); color: white; border: none; border-radius: 10px; padding: 0.65rem 1.5rem; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.88rem; cursor: pointer; margin-top: 0.75rem; transition: background 0.15s; }
    .btn-quiz-submit:hover { background: var(--navy-dark); }
    .btn-quiz-submit:disabled { background: #cbd5e1; cursor: not-allowed; }
    .quiz-score-banner { margin-top: 1rem; padding: 0.85rem 1.1rem; border-radius: 12px; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 0.9rem; text-align: center; }
    .quiz-score-0 { background: #fef2f2; color: #dc2626; border: 1.5px solid #fca5a5; }
    .quiz-score-1 { background: #fefce8; color: #ca8a04; border: 1.5px solid #fde047; }
    .quiz-score-2 { background: #eff6ff; color: #1d4ed8; border: 1.5px solid #93c5fd; }
    .quiz-score-3 { background: #f0fdf4; color: #16a34a; border: 1.5px solid #86efac; }
    .btn-quiz-retry { background: none; border: 1.5px solid var(--border); color: var(--subtext); border-radius: 10px; padding: 0.5rem 1rem; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.8rem; cursor: pointer; margin-top: 0.5rem; transition: all 0.15s; }
    .btn-quiz-retry:hover { border-color: var(--navy); color: var(--navy); }

    @media (max-width: 600px) {
      .hero h1 { font-size: 1.35rem; }
      .key-terms { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<nav class="topnav">
  <a id="back-link" href="#">← Back</a>
  <span class="topnav-title" id="nav-title">Revision</span>
</nav>

<div class="hero">
  <div class="hero-inner">
    <div class="hero-breadcrumb">
      <a href="index.html">Hub</a> ›
      <a id="subject-link" href="#">Subject</a> ›
      <a id="module-link" href="#">Module</a> ›
      <span id="breadcrumb-topic">Topic</span>
    </div>
    <div class="hero-top">
      <div class="hero-module-badge" id="hero-badge">B1</div>
      <div>
        <h1 id="hero-title">Loading...</h1>
        <div class="hero-sub" id="hero-sub"></div>
      </div>
    </div>
  </div>
</div>

<div class="topic-nav">
  <div class="topic-nav-inner" id="topic-nav"></div>
</div>

<div class="content-wrap" id="content-wrap">
  <div class="loading-state">Loading revision content...</div>
</div>

<script type="module">
  import { onAuthChange, loadRAG, saveRAG } from './firebase.js';

  const params = new URLSearchParams(window.location.search);
  const subject = params.get('subject') || 'biology';
  const moduleId = params.get('module') || 'b1';
  const topicParam = params.get('topic') || '';

  const MODULE_META = {
    b1:{title:'Cell Biology',colour:'#0d9488'}, b2:{title:'Organisation',colour:'#e85d4a'},
    b3:{title:'Infection & Response',colour:'#f59e0b'}, b4:{title:'Bioenergetics',colour:'#22c55e'},
    b5:{title:'Homeostasis & Response',colour:'#8b5cf6'}, b6:{title:'Inheritance & Evolution',colour:'#3b82f6'},
    b7:{title:'Ecology',colour:'#16a34a'},
    c1:{title:'Atomic Structure',colour:'#0ea5e9'}, c2:{title:'Bonding',colour:'#10b981'},
    c3:{title:'Quantitative Chemistry',colour:'#f59e0b'}, c4:{title:'Chemical Changes',colour:'#ef4444'},
    c5:{title:'Energy Changes',colour:'#8b5cf6'}, c6:{title:'Rate of Reaction',colour:'#f97316'},
    c7:{title:'Organic Chemistry',colour:'#06b6d4'}, c8:{title:'Chemical Analysis',colour:'#ec4899'},
    c9:{title:'Atmosphere',colour:'#16a34a'}, c10:{title:'Using Resources',colour:'#6366f1'},
    p1:{title:'Energy',colour:'#f97316'}, p2:{title:'Electricity',colour:'#eab308'},
    p3:{title:'Particle Model',colour:'#06b6d4'}, p4:{title:'Atomic Structure',colour:'#8b5cf6'},
    p5:{title:'Forces',colour:'#ec4899'}, p6:{title:'Waves',colour:'#14b8a6'},
    p7:{title:'Magnetism',colour:'#6366f1'},
  };

  const TIER_COLOURS = { not_started:'#cbd5e1', beginning:'#ef4444', developing:'#f97316', approaching:'#eab308', confident:'#22c55e', mastered:'#3b82f6' };
  const TIER_EMOJIS = { not_started:'⬜', beginning:'🔴', developing:'🟠', approaching:'🟡', confident:'🟢', mastered:'💙' };

  function getTier(score) {
    if (!score||score===0) return 'not_started';
    if (score<=33) return 'beginning';
    if (score<=55) return 'developing';
    if (score<=75) return 'approaching';
    if (score<=89) return 'confident';
    return 'mastered';
  }

  const meta = MODULE_META[moduleId] || { title: moduleId.toUpperCase(), colour: '#1a2a4f' };
  const subjectLabel = subject.charAt(0).toUpperCase() + subject.slice(1);
  const moduleKey = `${subject}-${moduleId}`;

  // Set up navigation
  document.getElementById('back-link').href = `module.html?subject=${subject}&module=${moduleId}`;
  document.getElementById('module-link').href = `module.html?subject=${subject}&module=${moduleId}`;
  document.getElementById('module-link').textContent = `${moduleId.toUpperCase()} ${meta.title}`;
  document.getElementById('subject-link').href = `${subject}.html`;
  document.getElementById('subject-link').textContent = subjectLabel;
  document.getElementById('nav-title').textContent = `${moduleId.toUpperCase()} Revision`;
  document.getElementById('hero-badge').textContent = moduleId.toUpperCase();
  document.getElementById('hero-badge').style.background = meta.colour;

  let allTopics = [];
  let currentTopic = '';
  let ragState = {};
  let currentUser = null;

  // Load data
  const [contentData] = await Promise.all([
    fetch(`data/revise/${subject}-${moduleId}-revise.json`).then(r => r.json()).catch(() => null),
  ]);

  if (!contentData) {
    document.getElementById('content-wrap').innerHTML = '<div class="error-state">Revision content not found for this module.</div>';
  } else {
    allTopics = Object.keys(contentData.topics || {});

    // Build topic nav
    const nav = document.getElementById('topic-nav');
    nav.innerHTML = allTopics.map(t =>
      `<button class="topic-nav-btn" onclick="showTopic('${t.replace(/'/g,"\\'")}', this)">${t}</button>`
    ).join('');

    // Auth — load RAG state
    onAuthChange(async user => {
      currentUser = user;
      if (user) {
        ragState = await loadRAG(user.uid, moduleKey).catch(() => ({})) || {};
      }
      // Show first topic or URL param topic
      const startTopic = topicParam && allTopics.includes(topicParam) ? topicParam : allTopics[0];
      if (startTopic) {
        const btn = nav.querySelector(`.topic-nav-btn`);
        showTopicByName(startTopic);
      }
    });
  }

  function showTopicByName(topicName) {
    const btns = document.querySelectorAll('.topic-nav-btn');
    btns.forEach(b => {
      b.classList.toggle('active', b.textContent === topicName);
    });
    renderTopic(topicName);
  }

  window.showTopic = (topicName, btn) => {
    document.querySelectorAll('.topic-nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTopic(topicName);
    // Update URL without reload
    const url = new URL(window.location);
    url.searchParams.set('topic', topicName);
    history.replaceState({}, '', url);
  };

  function renderTopic(topicName) {
    currentTopic = topicName;
    const topicData = contentData?.topics?.[topicName];
    if (!topicData) {
      document.getElementById('content-wrap').innerHTML = '<div class="error-state">Topic content not found.</div>';
      return;
    }

    // Update hero
    document.getElementById('hero-title').textContent = topicName;
    document.getElementById('hero-sub').textContent = `${moduleId.toUpperCase()} ${meta.title} · ${subjectLabel}`;
    document.getElementById('breadcrumb-topic').textContent = topicName;

    // RAG state for this topic
    const entry = ragState[topicName];
    const score = typeof entry === 'object' ? (entry?.score ?? 0) : 0;
    const tier = getTier(score);
    const isUnderstood = score >= 10;
    const ragHtml = `<span class="rag-indicator" style="background:${TIER_COLOURS[tier]}22;color:${TIER_COLOURS[tier]};border:1.5px solid ${TIER_COLOURS[tier]}44">${TIER_EMOJIS[tier]} ${score > 0 ? score + '%' : 'Not Started'}</span>`;

    let html = `<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:1.75rem;flex-wrap:wrap">
      <h1 style="font-family:'Nunito',sans-serif;font-weight:900;font-size:1.5rem;color:var(--navy);flex:1">${topicName}</h1>
      ${ragHtml}
    </div>`;

    // Intro
    if (topicData.intro) {
      html += `<div class="topic-section"><p style="font-size:0.95rem;line-height:1.8;color:var(--text)">${topicData.intro}</p></div>`;
    }

    // Sections
    (topicData.sections || []).forEach(section => {
      html += `<div class="topic-section">`;
      if (section.title) html += `<h2>${section.icon || '📌'} ${section.title}</h2>`;
      if (section.text) html += `<p>${section.text}</p>`;
      if (section.points) html += `<ul>${section.points.map(p => `<li>${p}</li>`).join('')}</ul>`;
      if (section.numbered) html += `<ol>${section.numbered.map(p => `<li>${p}</li>`).join('')}</ol>`;
      if (section.callout) {
        html += `<div class="callout callout-${section.callout.type || 'tip'}">
          <div class="callout-label">${section.callout.label || 'Note'}</div>
          <p>${section.callout.text}</p>
        </div>`;
      }
      if (section.diagram) {
        html += `<div class="diagram-wrap">${section.diagram}<p class="diagram-caption">${section.diagramCaption || ''}</p></div>`;
      }
      html += `</div>`;
    });

    // Key terms
    if (topicData.keyTerms?.length) {
      html += `<div class="topic-section"><h2>🔑 Key Terms</h2><div class="key-terms">`;
      topicData.keyTerms.forEach(kt => {
        html += `<div class="key-term"><div class="key-term-word">${kt.term}</div><div class="key-term-def">${kt.def}</div></div>`;
      });
      html += `</div></div>`;
    }

    // Exam tips
    if (topicData.examTips?.length) {
      html += `<div class="topic-section"><h2>✏️ Exam Tips</h2>`;
      topicData.examTips.forEach(tip => {
        html += `<div class="callout callout-exam"><div class="callout-label">Exam Tip</div><p>${tip}</p></div>`;
      });
      html += `</div>`;
    }

    // Common mistakes
    if (topicData.commonMistakes?.length) {
      html += `<div class="topic-section"><h2>⚠️ Common Mistakes</h2>`;
      topicData.commonMistakes.forEach(m => {
        html += `<div class="callout callout-warn"><div class="callout-label">Watch Out</div><p>${m}</p></div>`;
      });
      html += `</div>`;
    }

    // Videos
    const videos = topicData.videos || [];
    if (videos.length) {
      html += `<div class="videos-section"><h2>▶ Recommended Videos</h2><div class="video-grid">`;
      videos.forEach(v => {
        html += `<a href="${v.url}" target="_blank" rel="noopener" class="video-card">
          <div class="video-thumb">▶️</div>
          <div class="video-info">
            <div class="video-title">${v.title}</div>
            <div class="video-channel">${v.channel}</div>
          </div>
          <span class="video-arrow">↗</span>
        </a>`;
      });
      html += `</div></div>`;
    }

    // ── Quick Quiz ────────────────────────────────────────────────────────────
    html += `<div class="quiz-wrap" id="quiz-wrap">
      <div class="quiz-title">🧠 Quick Check — Have you understood this topic?</div>
      <div class="quiz-subtitle" id="quiz-subtitle">Answer 3 questions to test your understanding. You'll be told if each answer is correct but not given the answer — re-read if you're not sure!</div>
      <div id="quiz-body"><button class="btn-quiz-submit" onclick="loadQuiz()">Start Quiz →</button></div>
    </div>`;

    // Nav between topics
    const topicIndex = allTopics.indexOf(topicName);
    const prevTopic = topicIndex > 0 ? allTopics[topicIndex - 1] : null;
    const nextTopic = topicIndex < allTopics.length - 1 ? allTopics[topicIndex + 1] : null;
    html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.25rem;border-top:1px solid var(--border);gap:0.75rem">
      <div>
        ${prevTopic ? `<button onclick="showTopicByName('${prevTopic.replace(/'/g,"\\'")}'); scrollToTop()" style="background:none;border:1.5px solid var(--border);border-radius:10px;padding:0.55rem 1rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.8rem;cursor:pointer;color:var(--subtext)">← ${prevTopic}</button>` : ''}
      </div>
      <div>
        ${nextTopic ? `<button onclick="showTopicByName('${nextTopic.replace(/'/g,"\\'")}'); scrollToTop()" style="background:var(--navy);color:white;border:none;border-radius:10px;padding:0.55rem 1rem;font-family:'Nunito',sans-serif;font-weight:800;font-size:0.8rem;cursor:pointer">Next: ${nextTopic} →</button>` : `<span style="font-size:0.8rem;color:var(--subtext);font-family:'Nunito',sans-serif;font-weight:700">✅ All topics in this module covered!</span>`}
      </div>
    </div>`;

    document.getElementById('content-wrap').innerHTML = html;
    nudgeRAG(topicName);
  }

  window.scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

  // ── QUICK QUIZ ──────────────────────────────────────────────────────────────
  let _mcqData = null;

  // Load MCQ file once
  async function getMcqData() {
    if (_mcqData) return _mcqData;
    try {
      const r = await fetch(`data/mcq/${subject}-${moduleId}-mcq.json`);
      if (r.ok) _mcqData = await r.json();
    } catch(e) {}
    return _mcqData;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  window.loadQuiz = async () => {
    const body = document.getElementById('quiz-body');
    if (!body) return;
    body.innerHTML = '<div style="color:var(--subtext);font-size:0.85rem;padding:0.5rem 0">Loading questions...</div>';

    const mcq = await getMcqData();
    const topicQuestions = mcq?.topics?.[currentTopic];

    if (!topicQuestions || topicQuestions.length === 0) {
      body.innerHTML = '<div style="color:var(--subtext);font-size:0.85rem">No questions available for this topic yet.</div>';
      return;
    }

    // Pick 3 random questions, shuffle options
    const chosen = shuffle(topicQuestions).slice(0, 3);
    const quizState = chosen.map((q, i) => {
      const options = shuffle([q.a, ...q.d]);
      return { ...q, options, id: `q${i}` };
    });

    window._quizState = quizState;

    let html = '';
    quizState.forEach((q, i) => {
      html += `<div class="quiz-question" id="qq-${i}">
        <div class="quiz-q-text">Q${i+1}. ${q.q}</div>
        <div class="quiz-options">
          ${q.options.map((opt, j) => `
            <label class="quiz-option" id="qo-${i}-${j}">
              <input type="radio" name="${q.id}" value="${opt}" />
              ${opt}
            </label>`).join('')}
        </div>
      </div>`;
    });

    html += `<button class="btn-quiz-submit" id="quiz-submit-btn" onclick="submitQuiz()">Submit Answers →</button>`;
    body.innerHTML = html;
  };

  window.submitQuiz = async () => {
    const state = window._quizState;
    if (!state) return;
    const btn = document.getElementById('quiz-submit-btn');

    let correct = 0;
    let allAnswered = true;

    state.forEach((q, i) => {
      const selected = document.querySelector(`input[name="${q.id}"]:checked`);
      if (!selected) { allAnswered = false; return; }

      const isCorrect = selected.value === q.a;
      if (isCorrect) correct++;

      // Mark all options
      q.options.forEach((opt, j) => {
        const label = document.getElementById(`qo-${i}-${j}`);
        if (!label) return;
        if (opt === selected.value) {
          label.classList.add(isCorrect ? 'correct' : 'incorrect');
          const icon = document.createElement('span');
          icon.className = 'quiz-result-icon';
          icon.textContent = isCorrect ? '✅' : '❌';
          label.appendChild(icon);
        }
        // Disable all options
        const input = label.querySelector('input');
        if (input) input.disabled = true;
      });
    });

    if (!allAnswered) {
      // Highlight unanswered
      btn.textContent = 'Please answer all questions first!';
      setTimeout(() => { btn.textContent = 'Submit Answers →'; }, 2000);
      return;
    }

    // Disable submit button
    if (btn) btn.disabled = true;

    // Score messages
    const msgs = [
      { text: `0/3 — Don't worry, have another read through and try again! 📖`, cls: 'quiz-score-0' },
      { text: `1/3 — Good start! Re-read the sections you weren't sure about and try again.`, cls: 'quiz-score-1' },
      { text: `2/3 — Nearly there! One more read and you'll have it. 👍`, cls: 'quiz-score-2' },
      { text: `3/3 — Excellent! You've understood this topic. 🌟`, cls: 'quiz-score-3' },
    ];
    const msg = msgs[correct];

    // Score → RAG points (1=3%, 2=6%, 3=10%)
    const scoreMap = [0, 3, 6, 10];
    const points = scoreMap[correct];

    // Update RAG if score improves
    if (currentUser && points > 0) {
      const entry = ragState[currentTopic];
      const currentScore = typeof entry === 'object' ? (entry?.score ?? 0) : (entry || 0);
      const newScore = Math.max(currentScore, points);
      if (newScore > currentScore) {
        const updated = { ...(ragState[currentTopic] || {}), score: newScore, lastActivity: new Date().toISOString() };
        ragState[currentTopic] = updated;
        try { await saveRAG(currentUser.uid, moduleKey, ragState); } catch(e) {}
      }
    }

    // Show result
    const resultDiv = document.createElement('div');
    resultDiv.innerHTML = `
      <div class="quiz-score-banner ${msg.cls}">${msg.text}</div>
      ${points > 0 ? `<div style="font-size:0.75rem;color:var(--subtext);text-align:center;margin-top:0.4rem">+${points}% added to your topic score</div>` : ''}
      <div style="text-align:center;margin-top:0.75rem">
        <button class="btn-quiz-retry" onclick="loadQuiz()">🔄 Try again with new questions</button>
      </div>`;
    document.getElementById('quiz-body').appendChild(resultDiv);
  };

  async function nudgeRAG(topicName) {
    if (!currentUser) return;
    const entry = ragState[topicName];
    const score = typeof entry === 'object' ? (entry?.score ?? 0) : (entry || 0);
    if (score === 0) {
      // First visit — silent nudge to 1%
      const updated = { ...(ragState[topicName] || {}), score: 1, lastActivity: new Date().toISOString() };
      ragState[topicName] = updated;
      try { await saveRAG(currentUser.uid, moduleKey, ragState); } catch(e) {}
    }
  }
</script>
